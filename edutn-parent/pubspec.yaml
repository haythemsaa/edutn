name: edutn_parent
description: EDUTN PRO - Application Parents
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Authentication
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0

  # Localization
  intl: ^0.18.1
  easy_localization: ^3.0.3

  # Navigation
  go_router: ^12.1.3

  # Forms & Validation
  formz: ^0.6.1

  # Utils
  equatable: ^2.0.5
  get_it: ^7.6.4
  logger: ^2.0.2
  url_launcher: ^6.2.2
  file_picker: ^6.1.1
  image_picker: ^1.0.5

  # Chat & Messaging
  socket_io_client: ^2.0.3
  flutter_chat_ui: ^1.6.10

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.3.0

  # PDF & Documents
  pdf: ^3.10.7
  printing: ^5.11.1
  open_file: ^3.3.2

  # Charts & Graphs
  fl_chart: ^0.65.0

  # Calendar
  table_calendar: ^3.0.9

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
